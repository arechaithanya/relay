apiVersion: apps/v1
kind: Deployment
metadata:
  name: producer-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: producer-service
  template:
    metadata:
      labels:
        app: producer-service
    spec:
      containers:
        - name: producer-service
          image: REGION-docker.pkg.dev/PROJECT_ID/REPOSITORY/producer-service:IMAGE_TAG
          ports:
            - containerPort: 4001
          envFrom:
            - configMapRef:
                name: crisissync-config
          env:
            - name: PRODUCER_PORT
              value: "4001"
---
apiVersion: v1
kind: Service
metadata:
  name: producer-service
spec:
  type: LoadBalancer
  selector:
    app: producer-service
  ports:
    - port: 80
      targetPort: 4001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: processing-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: processing-service
  template:
    metadata:
      labels:
        app: processing-service
    spec:
      containers:
        - name: processing-service
          image: REGION-docker.pkg.dev/PROJECT_ID/REPOSITORY/processing-service:IMAGE_TAG
          envFrom:
            - configMapRef:
                name: crisissync-config
            - secretRef:
                name: crisissync-secrets
---
apiVersion: apps/v1
